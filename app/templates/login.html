{% extends "base.html" %}
{% block title %}Log in - PDF Tool{% endblock %}
{% block content %}
<div class="login-wrap">
  <form class="card login-card" method="post">
    <h1>PDF Tool</h1>
    <p class="note">Enter the shared password to continue.</p>
    {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <input type="hidden" name="next" value="{{ next }}">
    <div class="toolbar"><button type="submit">Log in</button></div>
  </form>
</div>
{% endblock %}
