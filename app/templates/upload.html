{% extends "base.html" %}
{% block title %}Upload - PDF Tool{% endblock %}
{% block content %}
<div class="page-head reveal">
  <h1>Load a PDF</h1>
  <p class="note">Nothing you upload is saved to disk. It's held in memory only for
    this session and is dropped automatically after an hour of inactivity.</p>
</div>

<div class="card reveal">
  <form method="post" action="{{ url_for('viewer.upload') }}" enctype="multipart/form-data">
    <label class="dropzone" for="file">
      <span class="dz-icon">&#8679;</span>
      <span class="dz-main">Drop a PDF here</span>
      <span class="dz-sub">or click to browse</span>
      <span class="dz-file"></span>
      <input type="file" id="file" name="file" accept="application/pdf" required>
    </label>
    <div class="toolbar"><button type="submit">Load document</button></div>
  </form>
</div>
{% endblock %}
