name: CI

# Three gates, all blocking: tests, lint and type checking.
#
# The app shells out to tesseract, ghostscript and qpdf via ocrmypdf and
# pikepdf, so the test runner needs the same system packages the Dockerfile
# installs -- pip alone is not enough. Lint and type checking do not execute
# the code, so they skip apt and install from pip only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            ghostscript \
            qpdf \
            unpaper \
            libgl1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # "python -m pytest" rather than bare "pytest": the -m form puts the
      # repository root on sys.path, so "from app.pdf_core import ..."
      # resolves. Bare pytest does not, and every test file fails to import.
      - name: Run tests
        env:
          APP_PASSWORD: ci-test-password
          FLASK_SECRET_KEY: ci-test-secret
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Pinned in requirements-dev.txt rather than installed loose. ruff's
      # default rule set changes between releases, so an unpinned install
      # turns a green build red over code nobody touched. The rules
      # themselves are pinned in pyproject.toml for the same reason.
      - name: Install ruff
        run: pip install -r requirements-dev.txt

      # Blocking. This step previously ended in "|| true", so it reported
      # findings and never failed, which meant it gated nothing.
      - name: Lint
        run: ruff check . --output-format=github

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Real dependencies, not stubbed out, so mypy checks against Flask,
      # numpy and Pillow's actual signatures. Only PyMuPDF is excepted, in
      # pyproject.toml, because it ships no py.typed marker. mypy does not
      # execute the code, so the apt packages are not needed here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type check
        run: mypy
